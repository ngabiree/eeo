name: Regenerate React lockfile

on:
  push:
    branches:
      - codex/react-runtime-alignment

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/react-runtime-alignment

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Align React runtime versions
        run: pnpm add -w -E react@19.2.8 react-dom@19.2.8

      - name: Verify frozen install and repository
        run: |
          rm -rf node_modules .next
          pnpm install --frozen-lockfile
          pnpm verify

      - name: Commit regenerated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes were produced."
            exit 1
          fi
          git commit -m "fix: align React runtime versions [lockfile-bot]"
          git push origin HEAD:codex/react-runtime-alignment
